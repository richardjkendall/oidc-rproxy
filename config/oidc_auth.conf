<VirtualHost *:80>
	LimitRequestFieldSize 32760
	LimitRequestFields 200
	LimitRequestLine 32760

	ErrorLog /dev/stdout
	LogFormat "%h %l %u %t \"%r\" %>s %b" common
	CustomLog /dev/stdout common

	OIDCProviderMetadataURL ${OIDC_PROVIDER_METADATA_URL}
	OIDCProviderJwksUri ${OIDC_PROVIDER_JWKS_URI}
	OIDCClientID ${OIDC_CLIENT_ID}
	OIDCClientSecret ${OIDC_CLIENT_SECRET}
	OIDCRedirectURI ${SCHEME}://${DOMAIN}:${PORT}/redirect_uri
	OIDCCookieDomain ${DOMAIN}
	OIDCCryptoPassphrase ${OIDC_CRYPTO_PASSPRHASE}

	OIDCScope "openid email"
	OIDCResponseType id_token
	OIDCResponseMode form_post

	# REQUIRED behind a TLS-terminating proxy. Do not remove.
	#
	# This image always sits behind an ingress that terminates TLS and speaks
	# plain HTTP to Apache. mod_auth_openidc must therefore be told which
	# X-Forwarded-* headers to believe when reconstructing the request URL.
	#
	# The module shipped with Ubuntu 18.04 trusted these implicitly. The one in
	# 24.04 does NOT, and without this directive it sees scheme "http" while
	# OIDCRedirectURI says "https", logs
	#
	#     the URL scheme (https) of the configured OIDCRedirectURI does not
	#     match the URL scheme of the URL being accessed (http): the "state"
	#     and "session" cookies will not be shared between the two!
	#
	# and refuses to share cookies. Every request then restarts the auth flow,
	# accumulating state cookies until the limit below is hit and the user gets
	# a 503. Found the hard way on 2026-08-21 during the 18.04 -> 24.04 upgrade;
	# it is the single most likely thing to break when moving an app onto this
	# image.
	OIDCXForwardedHeaders X-Forwarded-Proto X-Forwarded-Host X-Forwarded-Port

	# Discard the OLDEST state cookie rather than hard-failing at the limit.
	#
	# Without the trailing `true` a client with 7 in-flight authorization
	# attempts gets "no additional authorization request + state cookie can be
	# generated, aborting the request" and stays wedged until its cookies are
	# cleared by hand. With it, a stuck client self-heals on the next attempt.
	OIDCStateMaxNumberOfCookies 7 true

	OIDCSessionMaxDuration 28800
	OIDCSessionInactivityTimeout 3600
	OIDCRemoteUserClaim ${OIDC_RU}

	# server-cache, NOT client-cookie:persistent.
	#
	# client-cookie stores the ENTIRE session — id_token included — in browser
	# cookies, so every request carries roughly 8 KB of headers. On pc2 that put
	# ordinary requests at 8244 bytes against nginx's 8192-byte default
	# large_client_header_buffers: sitting exactly on the ceiling. Anything that
	# added a few hundred bytes fell off it. Headlamp's WebSocket handshake adds
	# ~180 bytes of Sec-WebSocket-* headers and got a flat 400 from nginx, with
	# the rejection logged to nginx's ERROR log rather than its access log — so
	# the request appeared in no access log anywhere and looked like it had
	# never been sent. That cost hours to find (2026-08-21).
	#
	# server-cache keeps the session in the shm cache below and gives the
	# browser only a session ID, taking requests from ~8 KB to a few hundred
	# bytes.
	#
	# TRADE-OFF, deliberate: shm is per-process-group and does not survive a
	# container restart, so restarting the proxy logs everyone out. With
	# client-cookie:persistent sessions survived restarts. For a single-replica
	# internal proxy that is a good trade; if you ever run more than one replica
	# you need a shared cache (OIDCCacheType redis/memcache) or sticky sessions,
	# because a request landing on the other replica will not find the session.
	#
	# Override per-deployment with OIDC_SESSION_TYPE if some app needs the old
	# behaviour.
	OIDCSessionType ${OIDC_ST}

	# Sized for the shm cache: 500 entries x 32 KB is ~16 MB of shared memory,
	# which is ample for an internal proxy and leaves headroom for id_tokens
	# carrying group claims. The default entry size is too small for a token
	# with many claims and fails at runtime rather than at config-test time.
	OIDCCacheType shm
	OIDCCacheShmMax 500
	OIDCCacheShmEntrySizeMax 32768

	<Location />
	   AuthType openid-connect
	   <RequireAny>
			Require ${AUTH_COND}
	   </RequireAny>
	</Location>

	RequestHeader set X-Remote-User expr=%{REMOTE_USER}
	RequestHeader set X-Remote-User-Groups "%{OIDC_claim_groups}e" env=OIDC_claim_groups

	# upgrade=websocket needs Apache >= 2.4.47 and handles the WebSocket upgrade
	# inside mod_proxy_http, in one directive that cannot disagree with itself.
	#
	# It replaces this, which shipped from 2021 until 2026-08-21:
	#
	#     ProxyPass  / "http://${UPSTREAM}"
	#     RewriteRule .* ws://${UPSTREAM}%{REQUEST_URI} [P]
	#
	# Those two lines disagreed about the trailing slash on UPSTREAM. ProxyPass
	# requires one; the RewriteRule assumed there was none. With the documented
	# UPSTREAM form of "host:port/" the rewrite produced ws://host:port//path,
	# and a doubled slash makes strict routers (Go's, for one) answer 301.
	# Browsers fail a WebSocket handshake on any response that is not 101, so
	# WebSockets were quietly broken for every app using this image.
	#
	# curl and wget did NOT reproduce it — both follow the 301 and report
	# success. Only a real browser fails.
	ProxyPass / "http://${UPSTREAM}" upgrade=websocket
	ProxyPassReverse / "http://${UPSTREAM}"

</VirtualHost>
